[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ontobot"
version = "0.1.0"
description = "온톨로지 기반 챗봇 서비스 (OntoBot) 백엔드"
requires-python = ">=3.12,<3.13"
# 버전은 고정(pinned)한다 — 오프라인 설치 번들(wheelhouse)과 개발 환경을 같게 맞추기 위함(TRD 3절).
# 고정값은 첫 설치 때 해석된 버전이다. 올릴 때는 이 파일만 고치고 번들을 다시 만든다.
dependencies = [
    "fastapi==0.148.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "neo4j==6.4.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "argon2-cffi==25.1.0",
]

# 가상환경은 uv가 관리한다: `uv sync` → backend/.venv, 실행은 `uv run …`.
# 전이 의존까지 포함한 전체 고정은 uv.lock 이 정본이다(커밋한다).
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "import-linter==2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontobot"]

# ---------------------------------------------------------------- 테스트
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: PostgreSQL·Neo4j가 필요한 테스트 (deploy/compose.test.yml)",
]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------- 정적 분석
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 한국어 문서·문구의 전각 문자를 오탐한다
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ontobot"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# 근거 대조(grounding)와 질의(query)는 결정 규칙의 핵심이라 strict로 검사한다(계획 Phase 0).
[[tool.mypy.overrides]]
module = ["ontobot.grounding.*", "ontobot.query.*"]
strict = true

# ---------------------------------------------------------------- 의존 규칙 (TRD 16.3)
# import-linter는 패키지 단위 규칙을 맡는다. "파일 하나에서만 import" 같은 세밀한 규칙과
# 5·6번(object 직접 읽기·권한 계산 금지)은 tests/unit/test_dependency_rules.py가 소스를 훑어 막는다.
[tool.importlinter]
root_package = "ontobot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "16.3-1 어떤 모듈도 api를 import하지 않는다 (main만 예외: 앱 팩토리)"
type = "forbidden"
source_modules = [
    "ontobot.ontology", "ontobot.objects", "ontobot.graph", "ontobot.sync",
    "ontobot.query", "ontobot.grounding", "ontobot.chat", "ontobot.llm",
    "ontobot.security", "ontobot.workshop", "ontobot.evaluation",
    "ontobot.tracing", "ontobot.jobs", "ontobot.db", "ontobot.config",
]
forbidden_modules = ["ontobot.api"]

[[tool.importlinter.contracts]]
name = "16.3-2 grounding은 순수 함수다 (llm·db·graph·sync 금지)"
type = "forbidden"
source_modules = ["ontobot.grounding"]
forbidden_modules = [
    "ontobot.llm", "ontobot.db", "ontobot.graph", "ontobot.sync",
    "sqlalchemy", "asyncpg", "neo4j",
]

[[tool.importlinter.contracts]]
name = "16.3-3 Neo4j 드라이버는 graph 패키지 밖에서 import하지 않는다"
type = "forbidden"
source_modules = [
    "ontobot.api", "ontobot.ontology", "ontobot.objects", "ontobot.sync",
    "ontobot.query", "ontobot.grounding", "ontobot.chat", "ontobot.llm",
    "ontobot.security", "ontobot.workshop", "ontobot.evaluation",
    "ontobot.tracing", "ontobot.jobs", "ontobot.db", "ontobot.config", "ontobot.main",
]
forbidden_modules = ["neo4j"]

[[tool.importlinter.contracts]]
name = "16.3-4 LLM SDK는 llm 패키지 밖에서 import하지 않는다"
type = "forbidden"
source_modules = [
    "ontobot.api", "ontobot.ontology", "ontobot.objects", "ontobot.graph",
    "ontobot.sync", "ontobot.query", "ontobot.grounding", "ontobot.chat",
    "ontobot.security", "ontobot.workshop", "ontobot.evaluation",
    "ontobot.tracing", "ontobot.jobs", "ontobot.db", "ontobot.config", "ontobot.main",
]
forbidden_modules = ["anthropic", "openai", "ollama"]
