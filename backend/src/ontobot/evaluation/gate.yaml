# 평가 게이트(TRD 13.1) — 지표(TRD 13.2, evaluation/metrics.py)가 여기 기준을 밑돌면 실패한다.
# 모델·프롬프트를 바꾸면 이 게이트를 통과해야 운영 설정에 반영한다.

# 불변식(확정, PRD 7절) — 어기면 품질이 아니라 결함이다. 값을 느슨하게 하지 말 것.
invariants:
  citation_rate: {min: 1.0}            # 화면에 보인 사실 문장은 모두 통과한 인용이 있다(8.2)
  fault_cover_ups: {max: 0}            # 장애를 주입한 문항이 failed 가 아닌 건수
  permission_violations: {max: 0}      # 금지 값·읽을 수 없는 타입이 답·근거에 나온 건수
  unanswerable_graded_rate: {max: 0}   # 답할 수 없는 문항을 ①·② 로 답한 비율
  harness_errors: {max: 0}             # 평가 장치 오류(예외) — 결과를 믿을 수 없다

# 가안 — PRD 7절 공란. 측정 뒤 확정한다(ADR-0009).
thresholds:
  accuracy: {min: 0.9}
  estimate_ratio: {max: 0.2}
  p95_ms: {max: 20000}                 # 로컬 Ollama gemma4:e4b 기준. 녹화 응답 모드에서는 보지 않는다
