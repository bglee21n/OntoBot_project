# 통합 테스트 전용(TRD 19절). 운영 compose 와 포트·볼륨을 공유하지 않는다.
# source-postgres 는 동기화 테스트의 '원천' DB 역할이다(계획 Phase 2, 커넥터 1종 = PostgreSQL).
name: ontobot-test

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_DB: ontobot_test, POSTGRES_USER: ontobot, POSTGRES_PASSWORD: ontobot-test}
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
  source-postgres:
    image: postgres:17
    environment: {POSTGRES_DB: source_test, POSTGRES_USER: source, POSTGRES_PASSWORD: source-test}
    ports: ["55433:5432"]
    tmpfs: [/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5-community
    environment: {NEO4J_AUTH: neo4j/ontobot-test}
    ports: ["57687:7687"]
