[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ontobot-deployer"
version = "0.1.0"
description = "OntoBot 배포 콘솔 — 번들 업로드·사전 점검·업그레이드·롤백·백업을 화면으로(ADR-0014)"
requires-python = ">=3.12,<3.13"
# 앱(backend)과 같은 고정 버전을 쓴다. ontobot 패키지는 쓰지 않는다 — 앱이 깨져도 이 콘솔은 돌아야 한다.
dependencies = [
    "fastapi==0.148.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "asyncpg==0.32.0",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontobot_deployer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
