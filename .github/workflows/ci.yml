# TRD 3절·19절: lint → unit → contract → integration → eval gate.
# 명령은 scripts/task.py 와 같은 것을 부른다(로컬과 CI가 갈라지지 않게).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.11.7"}
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run ruff check --config pyproject.toml ../scripts
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest tests/unit -q
      # 아직 비어 있는 층은 '수집된 테스트 없음'(5)을 통과로 본다 — scripts/task.py 와 같은 규칙.
      - run: uv run pytest tests/contract -q || [ $? -eq 5 ]

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Docker 없이(ADR-0007): Windows 러너에 미리 설치된 PostgreSQL 서비스를 켜고,
  # Neo4j Community 는 공식 zip(SHA-256 확인)을 받아 서비스로 띄운다 — 운영과 같은 OS·설치 방식.
  integration:
    needs: backend
    runs-on: windows-latest
    defaults: {run: {working-directory: backend}}
    env:
      ONTOBOT_DB_NAME: ontobot_test
      ONTOBOT_DB_USER: ontobot
      ONTOBOT_DB_PASSWORD: ontobot-test
      ONTOBOT_TEST_NEO4J_URI: bolt://localhost:7687
      ONTOBOT_TEST_NEO4J_PASSWORD: ontobot-test-graph
      NEO4J_VERSION: "5.26.32"
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 서비스 기동 · 테스트 DB 생성
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*"
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          $psql = Join-Path $env:PGBIN "psql.exe"
          & $psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ontobot LOGIN PASSWORD 'ontobot-test'"
          & $psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ontobot_test OWNER ontobot"
          & $psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ontobot_source_test OWNER ontobot"
      - name: Neo4j Community 설치·기동
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $url = "https://dist.neo4j.org/neo4j-community-$env:NEO4J_VERSION-windows.zip"
          $zip = Join-Path $env:RUNNER_TEMP "neo4j.zip"
          Invoke-WebRequest $url -OutFile $zip
          $expected = (Invoke-WebRequest "$url.sha256").Content.Trim().Split(" ")[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected.ToUpper()) { throw "Neo4j zip 해시 불일치" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $home4j = Join-Path $env:RUNNER_TEMP "neo4j-community-$env:NEO4J_VERSION"
          $bin = Join-Path $home4j "bin"
          Add-Content (Join-Path (Join-Path $home4j "conf") "neo4j.conf") "dbms.usage_report.enabled=false"
          & (Join-Path $bin "neo4j-admin.bat") dbms set-initial-password $env:ONTOBOT_TEST_NEO4J_PASSWORD
          & (Join-Path $bin "neo4j.bat") windows-service install
          & (Join-Path $bin "neo4j.bat") start
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-NetConnection localhost -Port 7687 -InformationLevel Quiet) { break }
            Start-Sleep -Seconds 2
          }
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.11.7"}
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest tests/integration -q -m integration

  # 평가 게이트(TRD 13절)는 Phase 7에서 붙인다 — 실제 모델 게이트와 PR별 녹화 응답 픽스처 모드.
