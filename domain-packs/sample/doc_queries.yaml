  - {q: "고위험 시설의 기준 등급은 몇부터인가요?", doc: risk-grade-guide.md, expect: "위험등급 4 이상을 고위험 시설로"}
  - {q: "요소 점수 합이 12점이면 등급이 어떻게 되나요?", doc: risk-grade-guide.md, expect: "12점 이상이면 위험등급 4"}
  - {q: "노후도 점수는 어떻게 매기지?", doc: risk-grade-guide.md, expect: "5년마다 1점씩"}
