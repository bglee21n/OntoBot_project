# 문서 검색 문항(합성, ADR-0016 측정 — scripts/spike_embed.py).
# expect: 정답 청크에 **그대로** 들어 있어야 하는 글(문서 파일 이름과 함께). 질문은 문서 문장을 베끼지 않고 바꿔 말한다.
