  - {q: "전주가 몇 도 이상 기울면 바꿔야 하나요?", doc: inspection-standard.md, expect: "5도를 넘는 전주"}
  - {q: "점검하고 나서 결과는 언제까지 입력해야 해?", doc: inspection-standard.md, expect: "7일 안에"}
