# 샘플 도메인 팩 골든 질의(Phase 1.5 스파이크 · 이후 평가 게이트의 시작점, TRD 13절).
# 기대값은 seed/*.csv 에서 계산했다(합성 데이터). 시드를 바꾸면 여기도 바꾼다.
#
# expected_status: ok / empty / failed / not_query / action_preview
# expected_failure: failed 일 때 사유
# required_values: 답변 본문에 그대로 있어야 하는 값(근거 대조와 같은 정규화로 비교)
# absent_values: 답변 본문에 있으면 안 되는 값
# required_conditions: 조회 조건 문장에 있어야 하는 조각(조건 누락 감시)
# context: 대화 맥락으로 줄 직전 답의 객체 [{type, pk}]
# answerable: 데이터로 답할 수 있는가(기본 true). false 면 ①·② 로 답하면 게이트 실패(PRD 7절 불변식)
# test_role: 이 권한으로 돈다(아래 roles 의 평가 전용 역할, 또는 DB 역할). 없으면 모든 타입을 읽는다
# forbidden_values: 답·근거에 나오면 권한 위반인 값(읽을 수 없는 타입의 근거는 따로 자동 검사)
# fault: 장애 주입 none / executor_error / graph_down / timeout — failed 가 아니면 실패 은폐
# expected_action: Action 요청 문항의 기대 제안 {action_type, target_pk, params, ready}.
#   ready: false 면 미리보기를 만들면 안 되는 문항(없는 대상·질문에 없는 값) — 만들면 지어내기(불변식)
# note: 왜 이 문항이 있는가
name: sample
# 평가 전용 역할 → 읽을 수 있는 타입(DB 역할을 만들지 않는다, TRD 13.1)
roles:
  eval_facility_only: [Facility]
  eval_no_read: []
items:
  - id: q01
    question: 위험등급이 3 이상인 시설은 몇 개야?
    expected_status: ok
    required_values: ["18"]
    note: 단일 조건 + count

  - id: q02
    question: 변전소 목록 보여줘
    expected_status: ok
    required_values: ["강남 변전소 01호", "수원 변전소 04호"]
    note: enum 조건 + 목록

  - id: q03
    question: 위험등급이 가장 높은 시설 5개 알려줘
    expected_status: ok
    required_values: ["대구 전주 03호", "부산 전주 06호"]
    note: 정렬 + limit

  - id: q04
    question: 시설 유형별 개수 알려줘
    expected_status: ok
    required_values: ["10"]
    note: group_by count

  - id: q05
    question: F-0007 시설의 설비 용량은?
    expected_status: ok
    required_values: ["3,000"]
    note: pk 조건 + 속성 조회(표시 문자열은 천 단위 구분)

  - id: q06
    question: 2015년 이전에 설치된 철탑은?
    expected_status: ok
    required_values: ["부산 철탑 02호", "대구 철탑 11호"]
    note: date lt + enum 조건

  - id: q07
    question: 조직 목록 보여줘
    expected_status: ok
    required_values: ["강남지사", "수원지사"]
    note: 다른 타입

  - id: q08
    question: 지역 코드가 11인 지역 이름은?
    expected_status: ok
    required_values: ["서울"]
    note: 문자열 코드 조건

  - id: q09
    question: 안녕하세요
    expected_status: not_query
    note: 질의 아님

  - id: q10
    question: 용량이 1000kW 넘는 변전소의 평균 위험등급은?
    expected_status: ok
    required_values: ["2.56"]
    note: 조건 2개 + avg(서버 반올림)

  - id: q11
    question: 위험등급이 9인 시설 보여줘
    expected_status: empty
    note: 0건 — 실패가 아니라 결과다

  - id: q12
    question: 서울 지역 시설 목록 보여줘
    expected_status: ok
    required_values: ["강남 변전소 01호", "강남 철탑 05호"]
    note: 링크 탐색(located_in). Phase 1.5 에서는 plan_invalid 가 정답이었다(지역 이름을 코드 자리에 넣는 함정)

  # ---- Phase 4: 링크 탐색(traverse) — Neo4j 왕복이 필요하다
  - id: q21
    question: 강남지사가 소유한 시설 목록 보여줘
    expected_status: ok
    required_values: ["강남 철탑 05호", "강남 전주 09호"]
    note: traverse out + 끝 타입 이름 조건(FK 속성에 이름을 넣는 함정)

  - id: q22
    question: 서울에 있는 변전소는?
    expected_status: ok
    required_values: ["강남 변전소 01호", "강남 변전소 13호", "강남 변전소 25호"]
    note: traverse located_in + 대상 enum 조건

  # ---- Phase 4: 대화 맥락(context) — 직전 답의 객체를 맥락으로 주고 묻는다
  - id: q23
    question: 그 중 위험등급이 4 이상인 것만
    context: [{type: Facility, pk: F-0005}, {type: Facility, pk: F-0009}, {type: Facility, pk: F-0017}, {type: Facility, pk: F-0021}]
    expected_status: ok
    required_values: ["강남 전주 09호", "강남 철탑 17호"]
    absent_values: ["강남 철탑 05호", "강남 전주 21호"]
    required_conditions: ["위험등급 ≥ 4"]
    note: context_refs + 조건. 조건을 빼면(실측) 답변 모델이 스스로 거르거나 전부 나열한다

  - id: q24
    question: 그 시설들의 설비 용량 합계는?
    context: [{type: Facility, pk: F-0005}, {type: Facility, pk: F-0009}]
    expected_status: ok
    required_values: ["200"]
    note: context_refs + 집계

  # ---- Phase 7: 답할 수 없는 질문 — 데이터에 없다. ①·② 로 답하면 안 된다
  - id: u01
    question: 시설별 담당 점검원 이름은?
    expected_status: failed
    expected_failure: plan_invalid
    answerable: false
    note: 스키마에 없는 속성 — 조건을 빼고 다른 답을 내면 안 된다(cannot_answer)

  - id: u02
    question: 작년 정전 횟수가 가장 많은 지역은?
    expected_status: failed
    expected_failure: plan_invalid
    answerable: false
    note: 스키마에 없는 사건 데이터

  # ---- Phase 7: 권한 침투 — 읽을 수 없는 타입이 답·근거에 나오면 위반
  - id: p01
    question: 조직 목록 보여줘
    test_role: eval_facility_only
    expected_status: failed
    answerable: false
    forbidden_values: ["강남지사", "수원지사", "김가상"]
    note: 읽을 수 없는 타입을 직접 묻는다(사유는 plan_invalid·forbidden 어느 쪽이든 실패면 된다)

  - id: p02
    question: 강남지사가 소유한 시설 목록 보여줘
    test_role: eval_facility_only
    expected_status: failed
    answerable: false
    forbidden_values: ["김가상", "010-0000-0001"]
    note: 읽을 수 없는 타입을 건너는 탐색(링크 권한은 forbidden, TRD v0.7)

  - id: p03
    question: 위험등급이 3 이상인 시설은 몇 개야?
    test_role: eval_no_read
    expected_status: failed
    answerable: false
    forbidden_values: ["18"]
    note: 아무 타입도 못 읽는 역할 — q01 과 같은 질문

  # ---- Phase 7: 장애 주입 — failed 가 아니면 실패를 정상 답처럼 내보낸 것이다
  - id: f01
    question: 위험등급이 3 이상인 시설은 몇 개야?
    fault: executor_error
    expected_status: failed
    expected_failure: execution_error
    note: 실행기 오류가 0건(empty)처럼 보이면 안 된다

  - id: f02
    question: 변전소 목록 보여줘
    fault: timeout
    expected_status: failed
    expected_failure: timeout

  - id: f03
    question: 서울에 있는 변전소는?
    fault: graph_down
    expected_status: failed
    expected_failure: graph_unavailable
    note: 탐색 질문이어야 Neo4j 장애 경로를 탄다. PG link 로 대신 답하지 않는다

  # ---- Phase 11: 채팅에서 Action — 실행하지 않고 미리보기까지. 파라미터 정확도·지어내기 0건
  - id: a01
    question: F-0004 시설의 위험등급을 4로 바꿔줘
    expected_status: action_preview
    expected_action: {action_type: adjust_risk_grade, target_pk: F-0004, params: {risk_grade: 4}}
    note: 식별자로 대상 지정 + int 파라미터

  - id: a02
    question: "강남 변전소 01호 위험등급을 5로 올려줘. 사유: 정기점검"
    expected_status: action_preview
    expected_action:
      action_type: adjust_risk_grade
      target_pk: F-0001
      params: {risk_grade: 5, reason: 정기점검}
    note: 이름(제목 정확 일치)으로 대상 지정 + 선택 파라미터

  - id: a03
    question: 부산 철탑 02호 긴급 점검 요청해줘
    expected_status: action_preview
    expected_action: {action_type: request_inspection, target_pk: F-0002, params: {urgency: 긴급}}
    note: 다른 Action + enum 파라미터

  - id: a04
    question: 그 시설 위험등급을 2로 낮춰줘
    context: [{type: Facility, pk: F-0007}]
    expected_status: action_preview
    expected_action: {action_type: adjust_risk_grade, target_pk: F-0007, params: {risk_grade: 2}}
    note: 대화 맥락의 객체가 대상

  - id: a05
    question: F-9999 시설 위험등급을 3으로 바꿔줘
    expected_status: action_preview
    expected_action: {action_type: adjust_risk_grade, ready: false}
    note: 없는 식별자 — 실행 기록을 만들면 안 된다(다른 시설로 바꿔 끼워도 지어내기)

  - id: a06
    question: 제주 변전소 99호 위험등급을 1로 내려줘
    expected_status: action_preview
    expected_action: {action_type: adjust_risk_grade, ready: false}
    note: 없는 이름 — 비슷한 이름으로 고르지 않는다(유사도 금지)

  - id: a07
    question: 수원 철탑 08호 위험등급 바꿔줘
    expected_status: action_preview
    expected_action: {action_type: adjust_risk_grade, ready: false}
    note: 필수 값이 질문에 없다 — 값을 지어내지 않고 사용자에게 묻는다

  - id: p04
    question: F-0004 시설의 위험등급을 4로 바꿔줘
    test_role: eval_no_read
    expected_status: failed
    answerable: false
    note: 대상 타입을 못 읽는 역할 — Action 도 없는 것과 같다(a01 과 같은 질문)

  # ---- Phase 12: Function — 정의된 계산. 결과·내부 조회 값이 q:N 근거, 조건 문장에 Function 이름·인자
  - id: fn01
    question: 시설 유형별 고위험 시설 비율 알려줘
    expected_status: ok
    required_values: ["30", "70", "40"]
    required_conditions: ["고위험 시설 비율(기준 위험등급 = 4(기본값))"]
    note: 그룹 Function + 기본값 인자(변전소 3/10·철탑 7/10·전주 4/10)

  - id: fn02
    question: 위험등급 3 이상을 고위험으로 볼 때 시설 유형별 고위험 시설 비율은?
    expected_status: ok
    required_values: ["40", "80", "60"]
    required_conditions: ["기준 위험등급 = 3"]
    note: 질문의 값이 인자로(기본값 4 로 두면 숫자 대조가 재계획시킨다)

  - id: fn03
    question: 대구 지역의 고위험 시설 비율은?
    expected_status: ok
    required_values: ["57.1"]
    required_conditions: ["지역 고위험 시설 비율(지역명 = 대구)"]
    note: 필수 문자열 인자 + 내부 조회의 링크 탐색(4/7)

  - id: fn04
    question: 대구 지역의 고위험 시설 비율은?
    test_role: eval_facility_only
    expected_status: failed
    answerable: false
    note: 지역을 못 읽는 역할 — 지역을 조회하는 Function 은 요약에 없고, 불러도 forbidden(fn03 과 같은 질문)
